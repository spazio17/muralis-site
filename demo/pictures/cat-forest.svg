<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="air" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe6b4"/>
      <stop offset="0.45" stop-color="#9cc58a"/>
      <stop offset="1" stop-color="#4f7d4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#fff8d6" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#f7efb8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f7efb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fffbe0" stop-opacity="0"/>
