    <linearGradient id="catFur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8290"/>
      <stop offset="0.6" stop-color="#9aa0ad"/>
      <stop offset="1" stop-color="#b3b8c2"/>
