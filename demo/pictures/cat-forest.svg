      <path d="M8,-30 C-20,-40 -40,-36 -58,-24 C-34,-22 -14,-22 8,-30 Z M14,-60 C-12,-74 -34,-72 -52,-62 C-28,-56 -8,-54 14,-60 Z M24,-92 C2,-108 -18,-110 -36,-102 C-14,-94 4,-90 24,-92 Z M38,-122 C20,-138 2,-142 -14,-136 C4,-126 20,-122 38,-122 Z M10,-34 C30,-56 52,-62 74,-58 C54,-44 32,-36 10,-34 Z M18,-64 C38,-86 60,-92 80,-90 C62,-76 40,-66 18,-64 Z M30,-96 C48,-116 66,-122 86,-122 C68,-108 50,-98 30,-96 Z M44,-126 C58,-142 72,-148 88,-150 C76,-136 62,-128 44,-126 Z" fill="#4f9440"/>
