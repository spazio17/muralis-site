<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa7e6"/>
      <stop offset="0.6" stop-color="#a9d6f5"/>
      <stop offset="1" stop-color="#e4f3fb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.35" stop-color="#fff3b8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff3b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc3a8"/>
      <stop offset="1" stop-color="#b9d6bd"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
