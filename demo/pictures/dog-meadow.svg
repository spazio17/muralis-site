    <ellipse cx="864" cy="788" rx="21" ry="10" fill="#fbf1e2"/>
    
    <circle cx="852" cy="525" r="62" fill="url(#fur)"/>
    <path d="M880,520 C930,520 960,535 962,560 C964,585 935,598 900,596 C870,594 858,575 860,555 Z" fill="#f6dfc0"/>
    <path d="M893,575 C915,590 940,588 952,578" fill="none" stroke="#6b3d1a" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="958" cy="548" rx="15" ry="11" fill="#2b1d16"/>
    <ellipse cx="954" cy="544" rx="5" ry="3" fill="#6d5a50"/>
