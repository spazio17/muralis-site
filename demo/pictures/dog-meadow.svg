    <linearGradient id="furDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8722c"/>
      <stop offset="1" stop-color="#9a5c22"/>
    </linearGradient>
    <g id="daisy">
