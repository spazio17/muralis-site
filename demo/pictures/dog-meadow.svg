      <circle r="9" fill="#fff" cx="0" cy="9"/><circle r="9" fill="#fff" cx="-9" cy="0"/>
      <circle r="8" fill="#fff" cx="6" cy="-6"/><circle r="8" fill="#fff" cx="6" cy="6"/>
      <circle r="8" fill="#fff" cx="-6" cy="6"/><circle r="8" fill="#fff" cx="-6" cy="-6"/>
      <circle r="6" fill="#f5c22b"/>
