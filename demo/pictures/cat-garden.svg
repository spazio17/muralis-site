      <stop offset="0.22" stop-color="#4f4580"/>
      <stop offset="0.4" stop-color="#b56a8c"/>
      <stop offset="0.5" stop-color="#ee9a66"/>
      <stop offset="0.58" stop-color="#ffcf88"/>
      <stop offset="1" stop-color="#ffdb98"/>
