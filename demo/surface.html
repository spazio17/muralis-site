<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muralis demo</title>
<link rel="stylesheet" href="app/admin.css?v=2">
<link rel="stylesheet" href="app/admin_palettes.css?v=2">
<link rel="stylesheet" href="demo.css?v=9">
<script>
  // As the app's own pages: the js class before the first paint turns on list-detail from 840 px.
  document.documentElement.className += ' js';
  var SURFACE = new URLSearchParams(location.search).get('surface') === 'panel' ? 'panel' : 'web';
  document.documentElement.dataset.surface = SURFACE;
  // Before the first paint, so neither frame flashes the wrong colours.
  try { document.documentElement.setAttribute('data-theme', localStorage.getItem('muralis-demo-theme-' + SURFACE) || (SURFACE === 'panel' ? 'dark' : 'system')); } catch (e) {}
</script>
</head>
<body>
<div id="wall" hidden></div>
<main id="settings"></main>
<div class="demo-snack" id="snack" role="status" aria-live="polite" hidden></div>
<script src="glyphs.js?v=2"></script>
<script src="demo.js?v=10"></script>
</body>
</html>
