# download/ holds the app people install by scanning the QR on the front page, and every
# other file in there is derived from that one APK: the checksum, the provisioning payload,
# the QR, and the plain listing page. A QR that no longer matches the APK beside it is the
# worst failure this site can ship, because it fails on a tablet that has already been wiped
# and says nothing useful about why.
#
# So this regenerates all of it and requires no diff, the same instinct as legal-check.yml
# and blueprint-check.yml: what the page shows and what a tablet is handed must be the same
# bytes.
name: download-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A Python of our own rather than the runner's system one: Ubuntu marks that one as
      # externally managed and pip refuses to install into it, a refusal that arrives with the
      # runner image rather than with any change here.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The only dependency, and only for rendering the QR. Everything else, including
      # reading the signing certificate out of the APK, is the standard library. Pinned to
      # the version the committed SVG was rendered with, because the check is a byte compare.
      - name: Install the QR encoder
        run: pip install --quiet segno==1.6.6

      - name: Everything in download/ must match the APK in it
        run: python3 scripts/check-download.py
